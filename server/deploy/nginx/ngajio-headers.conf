# Installed to /etc/nginx/snippets/ngajio-headers.conf
# Included at server level AND inside every location that sets its own add_header.
# No Content-Security-Policy yet (TODO, see DEPLOY.md). No Cross-Origin-Opener-Policy
# (it breaks the Google sign-in popup). HSTS without includeSubDomains on purpose.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
