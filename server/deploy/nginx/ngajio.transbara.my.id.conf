# Installed to /etc/nginx/sites-available/ngajio.transbara.my.id (symlink in sites-enabled).
# HTTP port 80 only. The owner runs certbot afterwards:
#   sudo certbot --nginx -d ngajio.transbara.my.id --redirect
# certbot adds the 443 block and the redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name ngajio.transbara.my.id;

    root /var/www/html/ngajio;
    index index.html;

    access_log /var/log/nginx/ngajio.access.log;
    error_log  /var/log/nginx/ngajio.error.log;

    include /etc/nginx/snippets/ngajio-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # certbot must be able to reach this path; keep it BEFORE the dotfile deny.
    location ^~ /.well-known/ { allow all; }
    location ~ /\. { deny all; }

    # Backend. The backend checks Origin host == Host, so Host MUST be $host.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    # SPA shell and app version marker: always revalidate.
    location = /index.html {
        include /etc/nginx/snippets/ngajio-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /_app/version.json {
        include /etc/nginx/snippets/ngajio-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # Service worker script: must never be served stale, or offline updates stall.
    location = /service-worker.js {
        include /etc/nginx/snippets/ngajio-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed assets.
    location /_app/immutable/ {
        include /etc/nginx/snippets/ngajio-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Web manifest: the stock mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/ngajio-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback (adapter-static, fallback index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
